<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with java script</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <style>
             .error { 
            color: red; 
            font-size: 14px; 
             }
        </style>
</head>

<body class="bg-light">

    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>Registration Form</h3>
            </div>

            <div class="card-body">

                <form id="myForm">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name">
                        <small class="error" id="nameError"></small>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                        <small class="error" id="emailError"></small>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                        <small class="error" id="passwordError"></small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword">
                        <small class="error" id="confirmPasswordError"></small>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" id="age">
                        <small class="error" id="ageError"></small>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone">
                        <small class="error" id="phoneError"></small>
                    </div>

                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label">Gender</label><br>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female"> Female
                        <br>
                        <small class="error" id="genderError"></small>
                    </div>

                    <!-- Country -->
                    <div class="mb-3">
                        <label class="form-label">Select Country</label>
                        <select class="form-control" id="country">
                            <option value="">Select Country</option>
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="UK">UK</option>
                        </select>
                        <small class="error" id="countryError"></small>
                    </div>

                    <!-- Message -->
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="message"></textarea>
                        <small class="error" id="messageError"></small>
                    </div>

                    <!-- Terms -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms">
                        <label class="form-check-label">Accept Terms &
                            Conditions</label>
                        <br>
                        <small class="error" id="termsError"></small>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn btn-primary w100">Submit</button>

                </form>

            </div>
        </div>
    </div>
    <script>
        document.getElementById("myForm").addEventListener("submit", function (event) {
            event.preventDefault(); // stop form from submitting 

            // Clear previous errors 
            document.querySelectorAll(".error").forEach(el => el.innerText = "");

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let confirmPassword =
                document.getElementById("confirmPassword").value.trim();
            let age = document.getElementById("age").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let gender = document.querySelector("input[name='gender']:checked");
            let country = document.getElementById("country").value.trim();
            let message = document.getElementById("message").value.trim();
            let terms = document.getElementById("terms").checked;

            let isValid = true; // flag 

            // Name 
             if (name === "") { 
        document.getElementById("nameError").innerText = "Full Name is required"; 
        isValid = false; 
            }

            // Email 
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (email === "") {
                document.getElementById("emailError").innerText = "Email is required";
                isValid = false;
            } else if (!email.match(emailPattern)) {
                document.getElementById("emailError").innerText = "Invalid email format";
                isValid = false;
            }

            // Password 
            if (password.length < 6) {
                document.getElementById("passwordError").innerText = "Password must be atleast 6 characters";
                isValid = false;
            }

            // Confirm Password 
            if (confirmPassword !== password) {
                document.getElementById("confirmPasswordError").innerText = "Passwords do not match";
                isValid = false;
            }

            // Age 
            if (age === "" || age < 1 || age > 120) {
                document.getElementById("ageError").innerText = "Enter valid age";
                isValid = false;
            }

            // Phone 
            let phonePattern = /^[0-9]{10}$/;
            if (!phone.match(phonePattern)) {
                document.getElementById("phoneError").innerText = "Phone must be 10 digits";
                isValid = false;
            }

            // Gender 
            if (!gender) {
                document.getElementById("genderError").innerText = "Please select gender";
                isValid = false;
            }

            // Country 
            if (country === "") {
                document.getElementById("countryError").innerText = "Select country";
                isValid = false;
            }

            // Message 
            if (message.length < 10) {
                document.getElementById("messageError").innerText = "Message must be at least 10 characters";
                isValid = false;
            }

            // Terms 
            if (!terms) {
                document.getElementById("termsError").innerText = "You must accept terms";
                isValid = false;
            }

            // Success 
            if (isValid) {
                alert("Form Submitted Successfully!");
            }
        }); 
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
